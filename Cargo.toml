[package]
name = "ripae"
version = "0.2.7-roll19"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = { version = "0.16.1", default-features = false, features = ["std", "derive"] }
axum = "0.8.9"
base64 = "0.23.1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "derive"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core", "signed"] }
tower-sessions-sqlx-store = { version = "0.15.1", features = ["sqlite"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1"
