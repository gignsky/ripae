{# A voyage's own fields. Expects `f: VoyageFormView`. Shared by the inline
   edit under an open voyage's header and the overlay the ledger opens. #}
<label>Bought on<input type="date" name="bought_at" value="{{ f.bought_at }}" required /></label>
<label>Ship<input type="text" name="ship" list="pick-ships" data-pick autocomplete="off" value="{{ f.ship }}" placeholder="no hull yet" /></label>
<label>Notes<input type="text" name="notes" value="{{ f.notes }}" /></label>
<label>Crew member<select name="logged_by" title="Whose run this is: they bought it and will sell it">{% for u in f.users %}<option value="{{ u.id }}"{% if f.owner == u.id.to_string() %} selected{% endif %}>{{ u.display_name|upper }}</option>{% endfor %}</select></label>
<label class="inline-label check"><input type="checkbox" name="move_loads" value="1"{% if f.move_loads %} checked{% endif %} /> Move the old crew member's unsold loads too</label>
<label>Logged by<select name="entered_by" title="Who typed this run in -- the bookkeeper, not necessarily whose run it is">{% for u in f.users %}<option value="{{ u.id }}"{% if f.entered_by == u.id.to_string() %} selected{% endif %}>{{ u.display_name|upper }}</option>{% endfor %}</select></label>
