{# Profit shares on a sale, with the template [+ ADD SHARE] clones.
   Expects `f: CloseFormView`. Shared by the close form and the sale editor. #}
<div class="ras sub-h"><span>Split profit</span><span>Percent of profit, or a flat fee. Remainder stays with the seller. Nothing is owed on a loss.</span></div>
<div class="shares">
  {% for s in f.shares %}
  <div class="ras share fields">
    <label>Crew<select name="share_to">{% for u in f.users %}<option value="{{ u.id }}"{% if s.to_user == u.id.to_string() %} selected{% endif %}>{{ u.display_name|upper }}</option>{% endfor %}</select></label>
    <label>Terms<select name="share_kind"><option value="pct"{% if s.kind != "flat" %} selected{% endif %}>% of profit</option><option value="flat"{% if s.kind == "flat" %} selected{% endif %}>Flat fee</option></select></label>
    <label>Amount<input name="share_amount" type="number" step="any" min="0" value="{{ s.amount }}" /></label>
    <label>For<input name="share_reason" type="text" placeholder="escort, loan, half the hull" value="{{ s.reason }}" /></label>
    <label>Forfeit to<select name="share_paid_to"><option value="">— keeps it</option>{% for u in f.users %}<option value="{{ u.id }}"{% if s.paid_to == u.id.to_string() %} selected{% endif %}>{{ u.display_name|upper }}</option>{% endfor %}</select></label>
    <span class="line-cmd"><button class="cmd danger rm-share" type="button">Remove</button></span>
  </div>
  {% endfor %}
</div>
<template class="share-tpl">
  <div class="ras share fields">
    <label>Crew<select name="share_to">{% for u in f.users %}<option value="{{ u.id }}">{{ u.display_name|upper }}</option>{% endfor %}</select></label>
    <label>Terms<select name="share_kind"><option value="pct" selected>% of profit</option><option value="flat">Flat fee</option></select></label>
    <label>Amount<input name="share_amount" type="number" step="any" min="0" value="25" /></label>
    <label>For<input name="share_reason" type="text" placeholder="escort, loan, half the hull" /></label>
    <label>Forfeit to<select name="share_paid_to"><option value="">— keeps it</option>{% for u in f.users %}<option value="{{ u.id }}">{{ u.display_name|upper }}</option>{% endfor %}</select></label>
    <span class="line-cmd"><button class="cmd danger rm-share" type="button">Remove</button></span>
  </div>
</template>
<div class="ras"><button class="cmd add-share" type="button">+ Add share</button></div>
