<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ripae</title>
    <link rel="stylesheet" href="/static/pico.min.css" />
    <script src="/static/htmx.min.js"></script>
    <script>
      // Validation failures come back as 422 with the form re-rendered and an
      // error line. htmx 1.9 refuses to swap any 4xx by default, so without
      // this the edit/close forms looked like they did nothing (0.1.3 bug).
      document.addEventListener("htmx:beforeSwap", function (e) {
        if (e.detail.xhr && e.detail.xhr.status === 422) {
          e.detail.shouldSwap = true;
          e.detail.isError = false;
        }
      });
    </script>
    <script src="/static/picker.js" defer></script>
    <script>
      // Date fields marked data-today are pre-filled with the server's UTC
      // date; swap in the viewer's local date unless they've changed it.
      document.addEventListener("htmx:load", function (e) {
        var root = e.detail && e.detail.elt;
        if (!root || !root.querySelectorAll) return;
        var now = new Date();
        var local = now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0") + "-" +
          String(now.getDate()).padStart(2, "0");
        root.querySelectorAll("input[data-today]").forEach(function (input) {
          if (input.value === input.defaultValue) input.value = local;
        });
      });
    </script>
    <style>
      .pick { position: relative; }
      .pick-menu {
        position: absolute; left: 0; right: 0; z-index: 10;
        margin: 0; padding: 0; list-style: none;
        max-height: 16rem; overflow-y: auto;
        background: var(--pico-background-color);
        border: 1px solid var(--pico-muted-border-color);
        border-radius: var(--pico-border-radius);
        box-shadow: var(--pico-box-shadow);
      }
      .pick-menu[hidden] { display: none; }
      .pick-menu li { list-style: none; margin: 0; padding: 0.4rem 0.75rem; cursor: pointer; }
      .pick-menu li[aria-selected="true"] {
        background: var(--pico-primary-background);
        color: var(--pico-primary-inverse);
      }
      .pick-menu mark { padding: 0; background: none; color: inherit; font-weight: bold; }
      .version-badge {
        position: fixed; right: 0.75rem; bottom: 0.5rem; z-index: 20;
        font-size: 0.75rem; color: var(--pico-muted-color);
        text-decoration: none;
      }
      .version-badge:hover { color: var(--pico-primary); text-decoration: underline; }
      [hidden] { display: none !important; }
      .cmd { background: none; border: 0; padding: 0; margin: 0 .3rem 0 0; font: inherit; color: var(--pico-primary); cursor: pointer; text-decoration: underline; width: auto; display: inline; }
      .cmd.danger { color: var(--pico-del-color); }
      .cmd::before { content: "["; } .cmd::after { content: "]"; }
      .status { border: 1px solid currentColor; padding: 0 .3rem; font-size: .75rem; text-transform: uppercase; }
      .crate { display: inline-grid; border: 1px solid currentColor; padding: .2rem .4rem; margin: .2rem; width: auto; font: inherit; }
      .crate.lost { text-decoration: line-through; color: var(--pico-del-color); }
      .crate.glitched { border-style: dashed; }
      .crate-tile { display: inline-grid; margin: .2rem; }
      .neg { color: var(--pico-del-color); }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>⚓ Ripae <small>LEDGER TERMINAL · NISC CARGO</small></h1>
        {% block rail %}{% endblock %}
      </header>
      {% block content %}{% endblock %}
      <div id="overlay"></div>
    </main>

    {# Works as a plain link without JS; with htmx it opens the dialog. #}
    <a class="version-badge" href="/changelog" title="What's new"
       hx-get="/changelog" hx-target="#changelog-body" hx-swap="innerHTML"
       onclick="document.getElementById('changelog').showModal()"
       >v{{ crate::changelog::VERSION }}</a>
    <dialog id="changelog" onclick="if (event.target === this) this.close()">
      <article>
        <header>
          <button aria-label="Close" rel="prev" onclick="this.closest('dialog').close()"></button>
          <strong>Ripae v{{ crate::changelog::VERSION }}</strong>
        </header>
        <div id="changelog-body"></div>
      </article>
    </dialog>
  </body>
</html>
