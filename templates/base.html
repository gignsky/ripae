<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ripae</title>
    <link rel="stylesheet" href="/static/pico.min.css" />
    <script src="/static/htmx.min.js"></script>
    <script src="/static/picker.js" defer></script>
    <style>
      .pick { position: relative; }
      .pick-menu {
        position: absolute; left: 0; right: 0; z-index: 10;
        margin: 0; padding: 0; list-style: none;
        max-height: 16rem; overflow-y: auto;
        background: var(--pico-background-color);
        border: 1px solid var(--pico-muted-border-color);
        border-radius: var(--pico-border-radius);
        box-shadow: var(--pico-box-shadow);
      }
      .pick-menu[hidden] { display: none; }
      .pick-menu li { list-style: none; margin: 0; padding: 0.4rem 0.75rem; cursor: pointer; }
      .pick-menu li[aria-selected="true"] {
        background: var(--pico-primary-background);
        color: var(--pico-primary-inverse);
      }
      .pick-menu mark { padding: 0; background: none; color: inherit; font-weight: bold; }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>⚓ Ripae</h1>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
